# Training node: collects the feed, archives it and retrains. Serves nobody.
#
#   docker compose -f docker-compose.training.yml up -d --build
#
# docker-compose.yml is the public site — Caddy, TLS, ports 80/443 — and stays
# untouched. This is the other role: a box whose product is the data, reached
# only over SSH. See DEPLOY.md "Training node" for why each difference exists.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # /seed and /train still exist and still mutate the buffer. Loopback-only
      # is not a reason to leave them unguarded — anyone with a shell on the box
      # could otherwise reset months of collection with one request.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      THERMALSENSE_DATA_DIR: /data
      # Same RAM constraint as the public box (1 GiB), and older days are in the
      # archive anyway, so the hot window is one day — see config.py, and the
      # 18 Sep 2026 outage it was lowered after.
      BEACON_RETENTION_DAYS: ${BEACON_RETENTION_DAYS:-1}
      # The nightly seed's two ceilings.  Both are here rather than left to
      # config defaults because this is the box where the cost is felt, and
      # because the run that wedged it on 18 Sep 2026 had neither: it built one
      # ~7 MB feature matrix per beacon, 20,000 of them, with no deadline.
      NIGHTLY_SEED_LIMIT: ${NIGHTLY_SEED_LIMIT:-2000}
      SEED_TIME_BUDGET_S: ${SEED_TIME_BUDGET_S:-1800}
      # Off on this box until a watched manual run proves the per-grid rewrite
      # holds. Live sampling put 165 positives and 12 benchmark groups into the
      # buffer in two hours of daylight on 19 Sep 2026, so nothing is waiting on
      # the seed; the gate is.
      ENABLE_NIGHTLY_SEED: ${ENABLE_NIGHTLY_SEED:-0}
      # No /predict traffic competes for cores here, so the fit can take both.
      # On the public box this is 1 so a retrain cannot stall serving.
      XGB_FIT_THREADS: ${XGB_FIT_THREADS:-2}
      # Türkiye + Europe by default. The worldwide feed is ~1.4 GB/day of hot
      # SQLite, which is the 17 Aug 2026 outage on a 1 GiB box, and it spends the
      # 1,000/day OpenTopoData quota on regions nobody is asking about. Narrowing
      # the box also switches OGN to the filtered port (14580) — see config.py.
      #
      # Seasonal: northern-hemisphere thermals fade from October. A training node
      # that should keep learning through the winter needs these moved south;
      # change them in .env and `up -d`, no rebuild.
      OGN_LAT_MIN: ${OGN_LAT_MIN:-34}
      OGN_LAT_MAX: ${OGN_LAT_MAX:-60}
      OGN_LON_MIN: ${OGN_LON_MIN:--10}
      OGN_LON_MAX: ${OGN_LON_MAX:-45}
    volumes:
      # A host path on the separate data disk, not a named volume. Named volumes
      # live under /var/lib/docker on the OS disk, which dies with the VM; the
      # data disk is created with deleteOption=Detach precisely so it does not.
      - ${DATA_ROOT:-/data/thermalsense}:/data
    # 700m on an 892 MB host left ~190 MB for the OS, Docker, sshd, resolved and
    # the Azure guest agent.  That held until the nightly seed scanned a 2.1 GB
    # SQLite file: the page cache took what was left, every host daemon went to
    # swap on the OS disk and did not come back.  The container itself was fine
    # throughout — it had its reservation — so nothing restarted, and the box was
    # unreachable for 36 h until an Azure-side restart.
    #
    # 600m was still too close: on 21 Sep 2026 the seed walked the container from
    # 390 MB to 530 MB in two minutes and the host was down to 71 MB available
    # before anything hit the cap, so sshd and the guest agent starved again --
    # with the DB at 0.12 GB, which is what ruled the scan out as the cause and
    # pointed at the per-beacon feature matrix instead.
    #
    # 500m keeps ~390 MB for the host.  Steady state is 135-190 MB, so the
    # headroom is real, and memswap_limit pinned to it means an overrun is an
    # OOM kill and a container restart: a failure that recovers itself, rather
    # than one that takes SSH down with it.
    mem_limit: 500m
    memswap_limit: 500m
    # Loopback only. Reach it with `ssh -L 8000:localhost:8000`. The NSG allows
    # nothing but SSH, and this keeps it off the public interface even if that
    # rule is ever loosened.
    ports:
      - "127.0.0.1:8000:8000"
    # Same as the Dockerfile's CMD minus --proxy-headers/--forwarded-allow-ips.
    # Those trust X-Forwarded-For from any peer, which is only safe while Caddy
    # is the sole route in (CLAUDE.md invariant 6). There is no proxy here, so
    # nothing legitimate ever sets that header.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "1", "--limit-concurrency", "64"]
