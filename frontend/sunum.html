<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThermalSense · LALE sınıfı İHA’lar için termal haritası</title>
    <meta name="description" content="ThermalSense ön tohum sunumu: termal haritasının LALE sınıfı insansız hava araçlarında havada kalış süresini uzatmak için nasıl kullanılabileceği." />
    <!--
      Theme, resolved before the bundle parses — the same bootstrap as
      index.html, reading the same key, so the landing page opens in whatever
      theme the visitor chose in the map app. Mirrors resolveInitialTheme() in
      src/theme/ThemeContext.jsx; change all three together.
    -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('thermalsense.theme');
          if (saved === 'dark' || saved === 'light') {
            t = saved;
          } else if (window.matchMedia &&
                     window.matchMedia('(prefers-color-scheme: light)').matches) {
            t = 'light';
          }
        } catch (e) { /* storage or matchMedia blocked - keep the default */ }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%230b1723'/><g fill='none' stroke='%237fc1f5' stroke-linecap='round' stroke-width='1.7'><path d='M8.2 6.2A7.5 7.5 0 1 0 15.8 6.2' stroke-dasharray='0.1 3' stroke-width='2.1'/><path d='M12 1.8v8.4M9 6h6M9 4.9v2.2'/></g><circle cx='12' cy='13.6' r='1.6' fill='%237fc1f5'/></svg>" />
    <!-- The brand mark from src/components/Icons.jsx (BrandMark); change both together. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pitch/main.jsx"></script>
  </body>
</html>
