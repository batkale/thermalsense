services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Fails fast rather than silently deploying an unguarded /train endpoint
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      THERMALSENSE_DATA_DIR: /data
    volumes:
      - thermalsense-data:/data
    # Deliberately not published to the host: all traffic goes through Caddy,
    # so there is no plaintext path that bypasses TLS.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # holds issued certs — keep this volume
      - caddy-config:/config
    depends_on:
      - app

volumes:
  thermalsense-data:
  caddy-data:
  caddy-config:
