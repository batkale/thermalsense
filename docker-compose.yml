services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Fails fast rather than silently deploying an unguarded /train endpoint
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      THERMALSENSE_DATA_DIR: /data
      # Sized against RAM, not disk — see the note in config.py. Listed here so
      # it can be retuned from .env and applied with `up -d` alone: compose's
      # .env is variable substitution for this file, not container environment,
      # so a bare BEACON_RETENTION_DAYS=... in .env would never reach the app.
      # Recreating beats rebuilding on a box that barely survives a build.
      BEACON_RETENTION_DAYS: ${BEACON_RETENTION_DAYS:-2}
    volumes:
      - thermalsense-data:/data
    # The VM has 896 MB of RAM total. Unbounded, a leak or a runaway /seed takes
    # the whole box with it — Caddy, sshd and the only way back in. A limit turns
    # that into a container the restart policy brings straight back.
    # Generous on purpose: steady state is ~135 MB, so this is a blast radius,
    # not a target. memswap_limit == mem_limit denies the container swap it
    # cannot use productively anyway; the host's 2 GB stays for the build.
    mem_limit: 700m
    memswap_limit: 700m
    # Deliberately not published to the host: all traffic goes through Caddy,
    # so there is no plaintext path that bypasses TLS. --forwarded-allow-ips in
    # the Dockerfile depends on this staying `expose` and never becoming `ports`.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # holds issued certs — keep this volume
      - caddy-config:/config
    depends_on:
      - app

volumes:
  thermalsense-data:
  caddy-data:
  caddy-config:
